<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prayer Library</title>
  <meta name="description" content="A quiet library of prayers you can listen to here or download in the Prayer App.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f5f0;
      --surface: #ffffff;
      --ink: #1f2a24;
      --muted: #5d6b63;
      --primary: #3b7a59;
      --on-primary: #ffffff;
      --chip: #e6efe8;
      --chip-on: #1f4a35;
      --border: #e2e5dd;
      --shadow: 0 1px 2px rgba(31, 42, 36, .05), 0 6px 20px rgba(31, 42, 36, .05);
      --radius: 20px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111713;
        --surface: #19211c;
        --ink: #e6eee9;
        --muted: #9db0a5;
        --primary: #7fc19f;
        --on-primary: #10281c;
        --chip: #24332a;
        --chip-on: #cfe8d9;
        --border: #26312a;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 64px; }
    header h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: -.02em; font-weight: 650; }
    header p { margin: 0; color: var(--muted); font-size: 1.05rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .link-card { margin: 28px 0 24px; }
    .link-card h2 { margin: 0 0 4px; font-size: 1rem; }
    .link-card p { margin: 0 0 12px; color: var(--muted); font-size: .95rem; }
    .link-row { display: flex; gap: 8px; }
    .link-row input {
      flex: 1; min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink);
      font: inherit; font-size: .9rem;
    }
    button {
      font: inherit; cursor: pointer;
      border: 0; border-radius: 12px;
      padding: 12px 18px;
      background: var(--primary); color: var(--on-primary);
      font-weight: 600;
    }
    button:hover { filter: brightness(1.06); }
    :is(button, input, audio, a):focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
    .chip {
      background: var(--chip); color: var(--chip-on);
      padding: 8px 14px; border-radius: 999px;
      font-size: .9rem; font-weight: 500;
    }
    .chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }

    .list { display: grid; gap: 14px; }
    .prayer h3 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 600; }
    .prayer p { margin: 0 0 12px; color: var(--muted); }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; font-size: .85rem; color: var(--muted); }
    .tag { background: var(--chip); color: var(--chip-on); padding: 2px 10px; border-radius: 999px; }
    audio { width: 100%; }
    .audio-error { color: var(--muted); font-size: .9rem; margin: 8px 0 0; }

    .state { text-align: center; color: var(--muted); padding: 36px 12px; }
    footer { margin-top: 36px; color: var(--muted); font-size: .9rem; text-align: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: no-preference) {
      .prayer { animation: rise .35s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Prayer Library</h1>
      <p>A quiet place to listen. The same prayers can be downloaded inside the Prayer App.</p>
    </header>

    <section class="card link-card" aria-labelledby="link-title">
      <h2 id="link-title">Prayer list address for the app</h2>
      <p>The app reads this file to find the available prayers.</p>
      <div class="link-row">
        <label class="sr-only" for="json-url">Prayer list address</label>
        <input id="json-url" type="text" readonly>
        <button id="copy" type="button">Copy</button>
      </div>
    </section>

    <div id="chips" class="chips" role="group" aria-label="Filter by category" hidden></div>
    <div id="status" class="state" role="status" aria-live="polite">Loading prayers…</div>
    <div id="list" class="list"></div>

    <footer>Take a slow breath before you press play.</footer>
  </main>

  <script>
    (function () {
      "use strict";
      var LABELS = {
        morning: "Morning", evening: "Evening", meal: "Meal",
        protection: "Protection", gratitude: "Gratitude", custom: "Other"
      };
      var jsonUrl = new URL("prayers.json", document.baseURI).href;
      var urlInput = document.getElementById("json-url");
      var statusEl = document.getElementById("status");
      var listEl = document.getElementById("list");
      var chipsEl = document.getElementById("chips");
      var prayers = [];
      var active = "all";

      urlInput.value = jsonUrl;

      document.getElementById("copy").addEventListener("click", function (e) {
        var btn = e.currentTarget;
        function done() {
          btn.textContent = "Copied";
          setTimeout(function () { btn.textContent = "Copy"; }, 1800);
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(jsonUrl).then(done, fallback);
        } else { fallback(); }
        function fallback() {
          urlInput.select();
          try { document.execCommand("copy"); done(); } catch (err) { /* user can copy by hand */ }
        }
      });

      function fmtDuration(sec) {
        var m = Math.floor(sec / 60), s = Math.round(sec % 60);
        return m + ":" + (s < 10 ? "0" : "") + s;
      }
      function fmtSize(bytes) {
        if (!bytes) return "";
        return bytes > 1048576 ? (bytes / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(bytes / 1024)) + " KB";
      }
      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function renderChips() {
        var cats = [];
        prayers.forEach(function (p) { if (cats.indexOf(p.category) === -1) cats.push(p.category); });
        chipsEl.textContent = "";
        if (cats.length < 2) { chipsEl.hidden = true; return; }
        chipsEl.hidden = false;
        ["all"].concat(cats).forEach(function (cat) {
          var b = el("button", "chip", cat === "all" ? "All" : (LABELS[cat] || cat));
          b.type = "button";
          b.setAttribute("aria-pressed", String(cat === active));
          b.addEventListener("click", function () { active = cat; renderChips(); renderList(); });
          chipsEl.appendChild(b);
        });
      }

      function renderList() {
        listEl.textContent = "";
        var shown = prayers.filter(function (p) { return active === "all" || p.category === active; });
        shown.forEach(function (p, i) {
          var card = el("article", "card prayer");
          card.style.animationDelay = Math.min(i, 8) * 40 + "ms";
          card.appendChild(el("h3", null, p.title));
          if (p.description) card.appendChild(el("p", null, p.description));

          var meta = el("div", "meta");
          meta.appendChild(el("span", "tag", LABELS[p.category] || p.category));
          if (p.duration) meta.appendChild(el("span", null, fmtDuration(p.duration)));
          if (p.file_size) meta.appendChild(el("span", null, fmtSize(p.file_size)));
          card.appendChild(meta);

          var audio = document.createElement("audio");
          audio.controls = true;
          audio.preload = "none";
          audio.src = p.audio_url;
          audio.setAttribute("aria-label", "Play " + p.title);
          audio.addEventListener("play", function () {
            document.querySelectorAll("audio").forEach(function (a) { if (a !== audio) a.pause(); });
          });
          audio.addEventListener("error", function () {
            if (!card.querySelector(".audio-error")) {
              card.appendChild(el("p", "audio-error", "This audio file could not be loaded."));
            }
          });
          card.appendChild(audio);
          listEl.appendChild(card);
        });
        statusEl.hidden = shown.length > 0;
        if (!shown.length) statusEl.textContent = "No prayers in this category yet.";
      }

      function showError(message) {
        statusEl.hidden = false;
        statusEl.textContent = message;
      }

      if (location.protocol === "file:") {
        showError("Open this page from the hosted site (or run: python -m http.server) so prayers.json can load.");
        return;
      }

      fetch(jsonUrl, { cache: "no-cache" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          if (!Array.isArray(data)) throw new Error("prayers.json must be a list");
          prayers = data.filter(function (p) { return p && p.title && p.audio_url; });
          if (!prayers.length) { showError("No prayers have been added yet."); return; }
          renderChips();
          renderList();
        })
        .catch(function () {
          showError("Prayers could not be loaded right now. Please try again later.");
        });
    })();
  </script>
</body>
</html>
